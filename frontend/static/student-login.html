<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f4f8;
      margin: 0;
      padding: 0;
    }
    h2 {
      margin-top: 80px;
      color: #333;
      font-size: 28px;
    }
    form {
      margin-top: 30px;
    }
    input {
      width: 250px;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: #333;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #555;
      transform: scale(1.05);
    }
    #profile {
      margin-top: 40px;
      text-align: left;
      display: inline-block;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h2>Student Login</h2>
  <form id="studentForm">
    <input type="email" id="email" placeholder="Student Email" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button type="submit">Login</button>
  </form>

  <div id="profile"></div>

  <script>
    document.getElementById("studentForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        // Step 1: Login request
        const loginRes = await fetch("http://localhost:5000/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const loginData = await loginRes.json();
        if (!loginRes.ok) {
          return alert(loginData.error || loginData.message);
        }

        const token = loginData.token;

        // Step 2: Fetch student profile
        const profileRes = await fetch("http://localhost:5000/auth/me", {
          method: "GET",
          headers: { Authorization: "Bearer " + token }
        });

        const profileData = await profileRes.json();

        // Step 3: Show profile details
        document.getElementById("profile").innerHTML = `
          <h3>Welcome, ${profileData.name}</h3>
          <p><strong>Email:</strong> ${profileData.email}</p>
          <p><strong>Role:</strong> ${profileData.role}</p>
          <p><strong>Enrolled Courses:</strong> ${profileData.enrolledCourses.length ? profileData.enrolledCourses.join(", ") : "None"}</p>
        `;
      } catch (err) {
        console.error(err);
        alert("Something went wrong");
      }
    });
  </script>
</body>
</html>

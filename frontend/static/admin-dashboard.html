<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    h2 {
      margin-top: 40px;
      color: #333;
    }
    table {
      margin: 40px auto;
      border-collapse: collapse;
      width: 80%;
      background: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px;
      border: 1px solid #ccc;
    }
    th {
      background-color: #333;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    #logoutBtn, #newBtn {
      margin: 20px 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    #logoutBtn {
      background-color: #333;
    }
    #logoutBtn:hover {
      background-color: #555;
    }
    #newBtn {
      background-color: #28a745;
    }
    #newBtn:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <h2>Admin Dashboard</h2>
  <p>Welcome, Admin! Here’s the list of all registered students.</p>

  <button id="newBtn">New Registration</button>
  <div id="studentTable"></div>
  <button id="logoutBtn">Logout</button>

  <script>
    const token = localStorage.getItem("token");

    if (!token) {
      alert("Please log in first.");
      window.location.href = "admin-login.html";
    }

    // ✅ Fetch students
    fetch("http://localhost:5000/admin/students", {
      headers: { Authorization: "Bearer " + token }
    })
      .then(res => res.json())
      .then(data => {
        if (!Array.isArray(data)) {
          return alert(data.error || data.message || "Failed to load students");
        }

        // Create table
        const table = document.createElement("table");
        table.innerHTML = `
          <tr style="background:#333;color:white;">
            <th style="padding:10px;border:1px solid #ccc;">ID</th>
            <th style="padding:10px;border:1px solid #ccc;">Name</th>
            <th style="padding:10px;border:1px solid #ccc;">Email</th>
            <th style="padding:10px;border:1px solid #ccc;">Actions</th>
          </tr>
          ${data.map(s => `
            <tr>
              <td style="padding:10px;border:1px solid #ccc;color:#007bff;cursor:pointer;text-decoration:underline;"
                  onclick="showDetails('${s._id}','${s.name}','${s.email}','${s.course || 'Not assigned'}')">${s._id}</td>
              <td style="padding:10px;border:1px solid #ccc;">${s.name}</td>
              <td style="padding:10px;border:1px solid #ccc;">${s.email}</td>
              <td style="padding:10px;border:1px solid #ccc;">
                <button style="background:#d9534f;color:white;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;"
                  onclick="deleteStudent('${s._id}')">Delete</button>
              </td>
            </tr>
          `).join("")}
        `;
        document.getElementById("studentTable").appendChild(table);
      })
      .catch(err => {
        console.error("Error fetching students:", err);
        alert("Error fetching students");
      });

    // ✅ Delete student function
    function deleteStudent(id) {
      if (!confirm("Are you sure you want to delete this student?")) return;

      fetch(`http://localhost:5000/admin/students/${id}`, {
        method: "DELETE",
        headers: { Authorization: "Bearer " + token }
      })
        .then(res => res.json())
        .then(data => {
          alert(data.message || "Student deleted");
          location.reload();
        })
        .catch(err => {
          console.error("Error deleting student:", err);
          alert("Error deleting student");
        });
    }

    // ✅ Show student details in modal (with course)
    function showDetails(id, name, email, course = "Not assigned") {
      const modal = document.createElement("div");
      modal.style.position = "fixed";
      modal.style.top = "0";
      modal.style.left = "0";
      modal.style.width = "100%";
      modal.style.height = "100%";
      modal.style.backgroundColor = "rgba(0,0,0,0.5)";
      modal.style.display = "flex";
      modal.style.justifyContent = "center";
      modal.style.alignItems = "center";
      modal.innerHTML = `
        <div style="background:#fff;padding:20px;border-radius:8px;width:300px;text-align:left;">
          <h3>Student Details</h3>
          <p><strong>ID:</strong> ${id}</p>
          <p><strong>Name:</strong> ${name}</p>
          <p><strong>Email:</strong> ${email}</p>
          <p><strong>Course:</strong> ${course}</p>
          <button style="background:#333;color:white;border:none;padding:8px 15px;border-radius:6px;cursor:pointer;"
            onclick="this.parentElement.parentElement.remove()">Close</button>
        </div>
      `;
      document.body.appendChild(modal);
    }

    // ✅ New registration button
    document.getElementById("newBtn").addEventListener("click", () => {
      window.location.href = "student-register.html";
    });

    // ✅ Logout button
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("token");
      window.location.href = "admin-login.html";
    });
  </script>
</body>
</html>
